spring:
  application:
    name: magaluaws

  datasource:
    url: jdbc:postgresql://postgres:5432/magaluaws
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

